<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>People — DashView</title>
<meta name="description" content="DashView People — headcount, hiring pipeline, device inventory, app spend, payroll and reviews in one workspace."/>
<meta name="theme-color" content="#F1DFA0"/>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="css/people.css"/>
</head>
<body class="hr-body">

<a class="hr-skip" href="#main">Skip to content</a>

<div class="hr-stage">
<div class="hr-shell">

  <!-- ════ Top bar ════════════════════════════════════════════════════ -->
  <header class="hr-top">
    <a class="hr-logo" href="index.html" id="orgMark">Crextio</a>

    <div class="hr-navwrap">
      <nav class="hr-nav" id="mainNav" role="tablist" aria-label="Workspace sections">
        <button class="hr-nav-btn" role="tab" data-view="dashboard" aria-selected="true">Dashboard</button>
        <button class="hr-nav-btn" role="tab" data-view="people"    aria-selected="false">People</button>
        <button class="hr-nav-btn" role="tab" data-view="hiring"    aria-selected="false">Hiring</button>
        <button class="hr-nav-btn" role="tab" data-view="devices"   aria-selected="false">Devices</button>
        <button class="hr-nav-btn" role="tab" data-view="apps"      aria-selected="false">Apps</button>
        <button class="hr-nav-btn" role="tab" data-view="salary"    aria-selected="false">Salary</button>
        <button class="hr-nav-btn" role="tab" data-view="calendar"  aria-selected="false">Calendar</button>
        <button class="hr-nav-btn" role="tab" data-view="reviews"   aria-selected="false">Reviews</button>
      </nav>

      <button class="hr-iconbtn hr-iconbtn--wide" id="settingsBtn" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Setting</span>
      </button>

      <div class="hr-rel">
        <button class="hr-iconbtn" id="bellBtn" aria-label="Notifications" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="hr-dot" id="bellDot" hidden></span>
        </button>
        <div class="hr-pop" id="notiPop" hidden role="dialog" aria-label="Notifications">
          <div class="hr-pop-head">
            <span class="hr-pop-title">Notifications</span>
            <button class="hr-pop-link" id="markReadBtn">Mark all read</button>
          </div>
          <div id="notiList"></div>
        </div>
      </div>

      <button class="hr-iconbtn hr-avatarbtn" id="meBtn" aria-label="Your profile"></button>
    </div>
  </header>

  <main id="main">

  <!-- ════ Dashboard ══════════════════════════════════════════════════ -->
  <section class="hr-view" id="view-dashboard" role="tabpanel" aria-label="Dashboard">

    <div class="hr-head">
      <h1 class="hr-title" id="welcomeLine">Welcome in, Nixtio</h1>

      <div class="hr-headrow">
        <div class="hr-cap">
          <div class="hr-cap-labels" id="capLabels"></div>
          <div class="hr-cap-track" id="capTrack"></div>
        </div>

        <div class="hr-stats" id="statRow"></div>
      </div>
    </div>

    <div class="hr-grid">

      <!-- Spotlight -->
      <article class="hr-spot hr-a-profile" id="spotCard" aria-label="Employee spotlight"></article>

      <!-- Weekly progress -->
      <article class="hr-card hr-a-progress">
        <div class="hr-card-head">
          <h2 class="hr-card-title">Progress</h2>
          <button class="hr-ghost" id="progressJump" aria-label="Open weekly timesheet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M7 17 17 7M9 7h8v8"/>
            </svg>
          </button>
        </div>
        <div class="hr-prog-lead">
          <span class="hr-prog-big" id="weekTotal">0 h</span>
          <span class="hr-prog-cap">Work Time<br/>this week</span>
        </div>
        <div class="hr-chart">
          <div class="hr-bars" id="weekBars"></div>
          <div class="hr-axis" id="weekAxis"></div>
        </div>
      </article>

      <!-- Time tracker -->
      <article class="hr-card hr-a-tracker">
        <div class="hr-card-head">
          <h2 class="hr-card-title">Time tracker</h2>
          <button class="hr-ghost" id="trackerJump" aria-label="Open timesheet history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M7 17 17 7M9 7h8v8"/>
            </svg>
          </button>
        </div>

        <div class="hr-track-body">
          <div class="hr-ring">
            <svg viewBox="0 0 200 200" aria-hidden="true">
              <g id="ringTicks"></g>
              <circle class="hr-ring-arc" id="ringArc" cx="100" cy="100" r="82"
                      stroke-dasharray="515" stroke-dashoffset="515"/>
            </svg>
            <div class="hr-ring-face">
              <div class="hr-ring-time" id="ringTime" role="timer" aria-live="off">00:00</div>
              <div class="hr-ring-cap">Work Time</div>
            </div>
          </div>
        </div>

        <div class="hr-track-foot">
          <button class="hr-round" id="playBtn" aria-label="Start timer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="hr-round" id="pauseBtn" aria-label="Pause timer" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          </button>
          <button class="hr-round hr-round--ink" id="resetBtn" aria-label="Reset today's timer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>
            </svg>
          </button>
        </div>
      </article>

      <!-- Onboarding -->
      <article class="hr-card hr-a-onboard">
        <div class="hr-onb-head">
          <h2 class="hr-card-title">Onboarding</h2>
          <span class="hr-onb-pct" id="onbPct">0%</span>
        </div>

        <div class="hr-onb-segs" id="onbSegs"></div>

        <div class="hr-stack">
          <div class="hr-tasks">
            <div class="hr-tasks-head">
              <span class="hr-tasks-title">Onboarding Task</span>
              <span class="hr-tasks-count" id="taskCount">0/0</span>
            </div>
            <ul class="hr-tasklist" id="taskList"></ul>
          </div>
        </div>
      </article>

      <!-- Detail accordion -->
      <article class="hr-card hr-card--flush hr-a-detail">
        <div class="hr-acc" id="detailAcc"></div>
      </article>

      <!-- Agenda -->
      <article class="hr-card hr-agenda hr-a-agenda">
        <div class="hr-agenda-head">
          <button class="hr-monthbtn" id="weekPrev"></button>
          <h2 class="hr-agenda-title" id="weekLabel"></h2>
          <button class="hr-monthbtn hr-monthbtn--next" id="weekNext"></button>
        </div>
        <div class="hr-agendawrap">
          <div class="hr-cal" id="calGrid"></div>
        </div>
      </article>

    </div>
  </section>

  <!-- ════ Secondary views (rendered by js/hr-views.js) ═══════════════ -->
  <section class="hr-view" id="view-people"   role="tabpanel" aria-label="People"   hidden></section>
  <section class="hr-view" id="view-hiring"   role="tabpanel" aria-label="Hiring"   hidden></section>
  <section class="hr-view" id="view-devices"  role="tabpanel" aria-label="Devices"  hidden></section>
  <section class="hr-view" id="view-apps"     role="tabpanel" aria-label="Apps"     hidden></section>
  <section class="hr-view" id="view-salary"   role="tabpanel" aria-label="Salary"   hidden></section>
  <section class="hr-view" id="view-calendar" role="tabpanel" aria-label="Calendar" hidden></section>
  <section class="hr-view" id="view-reviews"  role="tabpanel" aria-label="Reviews"  hidden></section>
  <section class="hr-view" id="view-settings" role="tabpanel" aria-label="Settings" hidden></section>

  </main>
</div>
</div>

<!-- ════ Event modal ══════════════════════════════════════════════════ -->
<div class="hr-modal" id="eventModal" hidden role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
  <div class="hr-modal-card">
    <h2 class="hr-modal-title" id="eventModalTitle">New event</h2>
    <p class="hr-modal-note" id="eventModalNote">Add it to the shared team calendar.</p>
    <div class="hr-form">
      <div>
        <label class="hr-label" for="evTitle">Title</label>
        <input class="hr-field" id="evTitle" placeholder="Design review"/>
      </div>
      <div>
        <label class="hr-label" for="evNote">Description</label>
        <input class="hr-field" id="evNote" placeholder="What the session covers"/>
      </div>
      <div class="hr-form-row">
        <div>
          <label class="hr-label" for="evStart">Starts</label>
          <input class="hr-field" id="evStart" type="time" step="900"/>
        </div>
        <div>
          <label class="hr-label" for="evEnd">Ends</label>
          <input class="hr-field" id="evEnd" type="time" step="900"/>
        </div>
      </div>
      <div>
        <label class="hr-label" for="evTone">Colour</label>
        <select class="hr-field" id="evTone">
          <option value="plain">Neutral</option>
          <option value="ink">Ink</option>
          <option value="butter">Butter</option>
        </select>
      </div>
    </div>
    <div class="hr-modal-foot">
      <button class="hr-btn hr-btn--quiet" id="evCancel">Cancel</button>
      <button class="hr-btn" id="evSave">Add event</button>
    </div>
  </div>
</div>

<!-- ════ Command palette ══════════════════════════════════════════════ -->
<div class="hr-cmd" id="cmdPalette" hidden role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="hr-cmd-card">
    <input class="hr-cmd-input" id="cmdInput" placeholder="Jump to a section or a colleague…" autocomplete="off"/>
    <ul class="hr-cmd-list" id="cmdList" role="listbox"></ul>
  </div>
</div>

<div class="hr-toasts" id="toasts" aria-live="polite"></div>

<script src="js/hr-store.js"></script>
<script src="js/hr-icons.js"></script>
<script src="js/hr-views.js"></script>
<script src="js/hr-app.js"></script>
</body>
</html>
